[package]
name = "ash-trusted-preparation"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
ash = { path = ".." }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
