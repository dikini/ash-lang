[package]
name = "ash"
version = "0.0.0"
description = "Implementation foundation for the Ash programming language"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
sha2 = "=0.10.9"
ash-native-buffer = { path = "native-buffer" }
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
unic-langid = "=0.9.6"
unicode-width = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }

[dev-dependencies]
ash-foreign-adapter = { path = "foreign-adapter" }

[workspace]
members = ["native-buffer", "foreign-adapter", "xtask"]
resolver = "3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
